server:
  port: 8000
spring:
  application:
    name: gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${VM_IP:http://localhost:4200}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
            allowedHeaders:
              - "*"
            maxAge: 3600
      routes:
        - id: user-public-routes
          uri: ${USER_ROUTE_URI:http://localhost:8001}
          predicates:
            - Path=/v1/users/authenticate
