security:
  password-secret: ${PASSWORD_SECRET}

jwt:
  secret: ${JWT_SECRET}
  zone: America/Guatemala
  access-token:
    expiration: 5
  refresh-token:
    expiration: 10_080

server:
  port: 8001
spring:
  application:
    name: ms_user
  datasource:
    url: ${DB_URL_USER}
    username: ${DB_USERNAME_USER}
    password: ${DB_PASSWORD_USER}
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
      idle-timeout: 60_000
      max-lifetime: 180_0000
      connection-timeout: 30_000
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
      dialect: org.hibernate.dialect.MariaDBDialect