<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="field">
    <label class="label">Motivo de Cancelación</label>
    <div class="control">
      <textarea
        class="textarea"
        formControlName="reason"
        placeholder="Explica el motivo de la cancelación"
      ></textarea>
    </div>
    <p class="help is-danger" *ngIf="form.get('reason')?.touched && form.get('reason')?.invalid">
      El motivo es obligatorio.
    </p>
  </div>

  <div class="field is-grouped is-justify-content-end mt-4">
    <div class="control">
      <button class="button is-danger" type="submit" [disabled]="form.invalid">
        Cancelar Caso
      </button>
    </div>
    <div class="control">
      <button class="button is-light" type="button" (click)="cancel.emit()">
        Volver
      </button>
    </div>
  </div>
</form>
