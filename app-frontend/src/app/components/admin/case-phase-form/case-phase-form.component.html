<form [formGroup]="form" (ngSubmit)="onSubmit()">

    <!-- Tipo de Caso -->
    <div class="field">
      <label class="label">Tipo de Caso</label>
      <div class="control">
        <div class="select is-fullwidth">
          <select formControlName="FK_Case_Types">
            <option [ngValue]="null" disabled>Seleccione un tipo</option>
            <option *ngFor="let type of caseTypes" [ngValue]="type.id">{{ type.name }}</option>
          </select>
        </div>
      </div>
      <p class="help is-danger" *ngIf="form.get('FK_Case_Types')?.touched && form.get('FK_Case_Types')?.invalid">
        Seleccione un tipo de caso.
      </p>
    </div>
  
    <!-- Fases dinámicas -->
    <div class="box" *ngFor="let phase of phasesFormArray.controls; let i = index" [formGroupName]="i">
      <div class="field is-grouped">
        <div class="control is-expanded">
          <input class="input" type="text" formControlName="name" placeholder="Nombre de la fase" />
        </div>
        <div class="control">
          <button class="button is-danger" type="button" (click)="removePhase(i)">✖</button>
        </div>
      </div>
    </div>
  
    <button class="button is-link is-light mb-3" type="button" (click)="addPhase()">+ Agregar Fase</button>
  
    <!-- Botones -->
    <div class="field is-grouped is-justify-content-end mt-4">
      <div class="control">
        <button class="button is-success" type="submit" [disabled]="form.invalid || phasesFormArray.length === 0">
          Guardar fases
        </button>
      </div>
      <div class="control">
        <button class="button is-light" type="button" (click)="cancel.emit()">Cancelar</button>
      </div>
    </div>
  
  </form>
