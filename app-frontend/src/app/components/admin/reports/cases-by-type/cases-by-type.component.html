<app-template>
  <div body class="body">
    <section class="section">
      <div class="container">
        <h1 class="title is-3">Casos por tipo de caso</h1>

        <div class="field">
          <label class="label">Selecciona un tipo de caso</label>
          <div class="control">
            <div class="select is-fullwidth">
              <select [(ngModel)]="selectedTypeId" (change)="loadReport()">
                <option [ngValue]="null">Todos los tipos</option>
                <option *ngFor="let t of caseTypes" [ngValue]="t.id">
                  {{ t.name }}
                </option>
              </select>
            </div>
          </div>
        </div>

        <table class="table is-fullwidth is-striped mt-4" *ngIf="report.length > 0">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre del caso</th>
              <th>Descripción</th>
              <th>Tipo</th>
              <th>Fecha creación</th>
              <th>Fecha límite</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let r of report">
              <td>{{ r.caseId }}</td>
              <td>{{ r.caseName }}</td>
              <td>{{ r.description }}</td>
              <td>{{ r.caseTypeName }}</td>
              <td>{{ r.createdAt | date: 'shortDate' }}</td>
              <td>{{ r.limitDate | date: 'shortDate' }}</td>
            </tr>
          </tbody>
        </table>

        <div *ngIf="report.length === 0" class="has-text-centered mt-5">
          <p class="is-size-5 has-text-grey">No se encontraron casos.</p>
        </div>
      </div>
    </section>
  </div>
</app-template>
