<app-template>
  <div body class="body">
    <section class="section">
      <div class="container">
        <h1 class="title is-3">Horas y dinero invertido por desarrollador</h1>

        <div class="field mt-4">
          <label class="label">Selecciona un desarrollador</label>
          <div class="control">
            <div class="select is-fullwidth">
              <select [(ngModel)]="userId" (change)="loadReport()">
                <option [ngValue]="null">Todos los desarrolladores</option>
                <option *ngFor="let u of users" [ngValue]="u.id">
                  {{ u.username }}
                </option>
              </select>
            </div>
          </div>
        </div>

        <table class="table is-striped is-fullwidth mt-5" *ngIf="report.length > 0">
          <thead>
            <tr>
              <th>ID</th>
              <th>Usuario</th>
              <th>Salario/Hora</th>
              <th>Total Horas</th>
              <th>Total Salario</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let r of report">
              <td>{{ r.id }}</td>
              <td>{{ r.username }}</td>
              <td>Q {{ r.salaryPerHour | number:'1.2-2' }}</td>
              <td>{{ r.totalHours | number:'1.2-2' }}</td>
              <td>Q {{ r.totalSalary | number:'1.2-2' }}</td>
            </tr>
          </tbody>
        </table>

        <div *ngIf="report.length === 0" class="has-text-centered mt-5">
          <p class="is-size-5 has-text-grey">No se encontraron resultados.</p>
        </div>
      </div>
    </section>
  </div>
</app-template>
