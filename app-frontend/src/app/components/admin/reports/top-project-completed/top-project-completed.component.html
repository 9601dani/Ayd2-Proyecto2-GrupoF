<app-template>
  <div body class="body">
    <section class="section">
      <div class="container">
        <h1 class="title is-3">Proyecto con más casos finalizados</h1>

        <br><br>
        <button
          class="button is-primary mt-4"
          (click)="generarPDF()"
          [disabled]="!loaded"
        >
          <span class="icon is-small">
            <mat-icon>picture_as_pdf</mat-icon>
          </span>
          <span>Exportar PDF</span>
        </button>
        <br><br>
        <div *ngIf="loaded; else loading">
          <div class="box">
            <p><strong>ID del proyecto:</strong> {{ report.projectId }}</p>
            <p><strong>Nombre del proyecto:</strong> {{ report.projectName }}</p>
            <p><strong>Total de casos finalizados: </strong> 
              <span class="has-text-weight-bold">{{ report.totalCases }}</span>
            </p>
          </div>
        </div>

        <ng-template #loading>
          <p class="is-size-5 has-text-grey">Cargando información del reporte...</p>
        </ng-template>
      </div>
    </section>
  </div>
</app-template>
