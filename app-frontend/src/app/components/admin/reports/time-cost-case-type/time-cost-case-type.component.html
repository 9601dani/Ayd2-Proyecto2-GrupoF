<app-template>
  <div body class="body">
    <section class="section">
      <div class="container">
        <h1 class="title is-3">Horas y dinero invertido por tipo de caso</h1>

        <div class="field mt-4">
          <label class="label">Selecciona un tipo de caso</label>
          <div class="control">
            <div class="select is-fullwidth">
              <select [(ngModel)]="selectedTypeId" (change)="loadReport()">
                <option [ngValue]="null">Todos los tipos de caso</option>
                <option *ngFor="let type of caseTypes" [ngValue]="type.id">
                  {{ type.name }}
                </option>
              </select>
            </div>
          </div>
        </div>
        <br>
        <button
          class="button is-primary"
          (click)="generarPDF()"
          [disabled]="this.report.length < 1"
        >
          <span class="icon is-small">
            <mat-icon>picture_as_pdf</mat-icon>
          </span>
          <span>Generar PDF</span>
        </button>
        

        <table class="table is-striped is-fullwidth mt-5" *ngIf="report.length > 0">
          <thead>
            <tr>
              <th>ID Tipo</th>
              <th>Nombre</th>
              <th>Total Horas</th>
              <th>Total Invertido</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let r of report">
              <td>{{ r.typeId }}</td>
              <td>{{ r.typeName }}</td>
              <td>{{ r.totalHours | number:'1.2-2' }}</td>
              <td>Q {{ r.totalInvested | number:'1.2-2' }}</td>
            </tr>
          </tbody>
        </table>

        <div *ngIf="report.length === 0" class="has-text-centered mt-5">
          <p class="is-size-5 has-text-grey">No se encontraron datos.</p>
        </div>
      </div>
    </section>
  </div>
</app-template>
