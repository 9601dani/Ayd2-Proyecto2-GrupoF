<form [formGroup]="form" (ngSubmit)="onSubmit()">

    <!-- Nombre del Tipo de Caso -->
    <div class="field">
      <label class="label">Nombre del Tipo de Caso</label>
      <div class="control">
        <input class="input" type="text" formControlName="name" placeholder="Ej. Investigación">
      </div>
      <p class="help is-danger" *ngIf="form.get('name')?.touched && form.get('name')?.invalid">
        El nombre es obligatorio.
      </p>
    </div>
  
    <!-- Descripción -->
    <div class="field">
      <label class="label">Descripción</label>
      <div class="control">
        <textarea class="textarea" formControlName="description" placeholder="Describe el tipo de caso"></textarea>
      </div>
      <p class="help is-danger" *ngIf="form.get('description')?.touched && form.get('description')?.invalid">
        La descripción es obligatoria.
      </p>
    </div>
  
    <!-- Lista de Fases -->
    <div formArrayName="phases" class="mt-4">
      <label class="label">Fases del Caso (orden se respeta)</label>
  
      <div *ngFor="let phase of phases.controls; let i = index" [formGroupName]="i" class="box mb-3">
        <!-- Nombre de Fase -->
        <div class="field">
          <label class="label">Nombre de la Fase</label>
          <div class="control">
            <input class="input" type="text" formControlName="name" placeholder="Ej. Revisión Inicial">
          </div>
          <p class="help is-danger" *ngIf="phase.get('name')?.touched && phase.get('name')?.invalid">
            El nombre de la fase es obligatorio.
          </p>
        </div>
  
        <!-- Botón para eliminar fase -->
        <div class="field is-grouped is-grouped-right">
          <div class="control">
            <button class="button is-danger is-light is-small" type="button" (click)="removePhase(i)" *ngIf="phases.length > 1">
              Eliminar Fase
            </button>
          </div>
        </div>
      </div>
  
      <!-- Botón para agregar nueva fase -->
      <div class="field">
        <button class="button is-link is-light" type="button" (click)="addPhase()">
          Agregar Fase
        </button>
      </div>
    </div>
  
    <!-- Botones de acción -->
    <div class="field is-grouped is-justify-content-end mt-4">
      <div class="control">
        <button class="button is-success" type="submit" [disabled]="form.invalid">
          {{ mode === 'create' ? 'Registrar Tipo de Caso' : 'Actualizar Tipo de Caso' }}
        </button>
      </div>
      <div class="control">
        <button class="button is-light" type="button" (click)="cancel.emit()">Cancelar</button>
      </div>
    </div>
  
  </form>
