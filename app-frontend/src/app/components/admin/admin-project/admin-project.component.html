<app-template>
  <div body class="body">
    <div *ngIf="project">
      <section class="section">
        <div class="container">
          <div class="box">
            <h2 class="title is-3 has-text-link">{{ project.name }}</h2>
            <div class="content">
              <p>{{ project.description }}</p>
            </div>
          </div>
        </div>
      </section>
      <section class="section">
        <div class="container">
          <h1 class="title is-3 has-text-weight-bold">Casos</h1>
          <div class="mb-4">
            <button class="button is-primary">Crear nuevo caso</button>
          </div>
        </div>
      </section>
    </div>
  </div>
</app-template>
