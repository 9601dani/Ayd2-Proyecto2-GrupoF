<app-template>
    <div body class="body">
      <section class="section">
        <div class="container">
          <h1 class="title is-2 has-text-weight-bold">Proyectos Congelados </h1>
        </div>
      </section>
      <section class="section">
        <div class="columns is-multiline">
          <div class="column is-one-quarter" *ngFor="let project of projects">
            <div class="card has-text-centered" style="height: 100%">
              <header class="card-header">
                <p class="card-header-title is-size-5 has-text-weight-bold">
                  {{ project.name }}
                </p>
              </header>
  
              <div class="card-content">
                <div
                  class="content is-size-8 has-text-grey-dark"
                  style="min-height: 80px"
                >
                  {{
                    project.description.length > 125
                      ? (project.description | slice : 0 : 125) + "..."
                      : project.description
                  }}
                </div>
              </div>
  
              <footer
                class="card-footer is-justify-content-center is-align-items-center"
                style="height: 50px"
              >
                <button
                  class="button is-warning m-1"
                  (click)="openModal('active', project)"
                >
                  Activar Proyecto
                </button>
              </footer>
            </div>
          </div>
        </div>
      </section>
    </div>
  </app-template>
  
  <app-modal>
  
    <div modalTitle class="modal-card-title" *ngIf="actualAction === 'active'">
      Confirmar acción
    </div>
    <div modalContent *ngIf="actualAction === 'active'">
      <p>
        ¿Deseas activar el proyecto <strong>{{ projectSelected?.name }}</strong
        >?
      </p>
    </div>
    <div modalButtons *ngIf="actualAction === 'active'">
      <button class="button is-danger" (click)="activeProject()">
        Sí, activar
      </button>
      <button class="button" (click)="closeModal()">Cancelar</button>
    </div>
  </app-modal>
