<app-modal>
  <p modalTitle class="modal-card-title">Inicio de Sesión</p>
  <div modalContent>
    @if(isLoading) {
      <div class="custom-spinner">
        <mat-spinner></mat-spinner>
      </div>
    }
    <form [formGroup]="loginForm">
      <div class="field">
        <label class="label">Nombre de usuario o Correo</label>
        <div class="control">
          <input formControlName="usernameOrEmail" type="text" class="input" placeholder="Ingrese su nombre de usuario o correo">
        </div>
      </div>

      <div class="field has-addons">
        <div class="control is-expanded">
          <input formControlName="password" [type]="visibility ? 'text' : 'password'" class="input" placeholder="Ingrese su contraseña">
        </div>
        <div class="control">
          <button type="button" class="button is-primary" (click)="visibility = !visibility">
            <mat-icon [fontIcon]="visibility ? 'visibility' : 'visibility_off'"></mat-icon>
          </button>
        </div>
      </div>
    </form>
  </div>
  <div modalButtons>
    <button type="submit" class="button is-success" [disabled]="this.loginForm.invalid" (click)="authenticate()">Iniciar Sesión</button>
    <button type="button" class="button ml-2">Cancelar</button>
  </div>
</app-modal>
